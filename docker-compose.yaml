name: zumi

x-base: &base
  env_file:
    - .env

services:
  otel-collector:
    <<: *base
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      OTEL_COLLECTOR_CONFIG_EXPAND_ENV: "true"
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-dev}"
    ports:
      - "127.0.0.1:${COLLECTOR_OTLP_GRPC_HOST_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${COLLECTOR_OTLP_HTTP_HOST_PORT:-4318}:4318" # OTLP HTTP
      - "127.0.0.1:${COLLECTOR_HEALTH_CHECK_HOST_PORT:-13133}:13133" # HEALTH CHECK
      - "127.0.0.1:${COLLECTOR_ZPAGES_HOST_PORT:-55679}:55679" # ZPAGES
      - "127.0.0.1:${COLLECTOR_SELF_METRICS_HOST_PORT:-8888}:8888" # collector self-metrics

  postgres:
    <<: *base
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-zumi}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-zumi}"
      POSTGRES_DB: "${POSTGRES_DB:-zumi}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  keycloak:
    <<: *base
    image: quay.io/keycloak/keycloak:26.8.2
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zumi}"
      KC_DB_USERNAME: "${POSTGRES_USER:-zumi}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-zumi}"
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: "${KEYCLOAK_URL:-http://localhost:8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KEYCLOAK_CHANNEL_CLIENT_SECRET: "${KEYCLOAK_CHANNEL_CLIENT_SECRET:-dev-zumi-channel-secret}"
      KEYCLOAK_HARNESS_CLIENT_SECRET: "${KEYCLOAK_HARNESS_CLIENT_SECRET:-dev-zumi-harness-secret}"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"

volumes:
  postgres-data:

networks:
  default:
    name: zumi
